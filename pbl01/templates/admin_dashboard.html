<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
</head>
<body>
    <h1>Welcome, Admin!</h1>

    <h2>Users</h2>
    <ul>
        {% for user in users %}
            <li>{{ user['username'] }} - {{ user['email'] }}</li>
        {% endfor %}
    </ul>

    <h2>Posts</h2>
    <ul>
        {% for post in posts %}
            <li>{{ post['text'] }} - {{ post['post_time'] }}</li>
        {% endfor %}
    </ul>

    <form method="POST">
        <textarea name="text" placeholder="Post something as admin..."></textarea><br>
        <button type="submit">Post</button>
    </form>

    <p><a href="{{ url_for('login') }}">Logout</a></p>
</body>
</html>
